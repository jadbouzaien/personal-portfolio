      <stop offset="1" stop-color="#6BFDD9" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="paint3_linear" x1="20" y1="-20" x2="-10" y2="20" gradientUnits="userSpaceOnUse">

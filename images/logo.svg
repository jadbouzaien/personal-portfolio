<svg width="173" height="50" viewBox="0 0 173 50" xmlns="http://www.w3.org/2000/svg">
  <!-- Texte Lupix -->
  <text x="66" y="36" font-family="Arial, sans-serif" font-size="36" fill="#F8F8F8">Lupix</text>

  <!-- Gradient Dot -->
  <circle cx="168.6" cy="32.9" r="3.6" fill="url(#paint0_linear)" />

  <!-- Geometric Logo -->
  <g transform="translate(25, 25)">
    <!-- Disconnected corner lines (top-left) -->
    <line x1="-18" y1="-18" x2="-10" y2="-18" stroke="url(#paint1_linear)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-18" y1="-18" x2="-18" y2="-10" stroke="url(#paint1_linear)" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Disconnected corner lines (top-right) -->
    <line x1="18" y1="-18" x2="10" y2="-18" stroke="url(#paint1_linear)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="18" y1="-18" x2="18" y2="-10" stroke="url(#paint1_linear)" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Disconnected corner lines (bottom-right) -->
    <line x1="18" y1="18" x2="10" y2="18" stroke="url(#paint1_linear)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="18" y1="18" x2="18" y2="10" stroke="url(#paint1_linear)" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Disconnected corner lines (bottom-left) -->
    <line x1="-18" y1="18" x2="-10" y2="18" stroke="url(#paint1_linear)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-18" y1="18" x2="-18" y2="10" stroke="url(#paint1_linear)" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Inner geometric shapes -->
    <polygon points="0,-15 10,-5 10,5 0,15 -10,5 -10,-5" fill="url(#paint2_linear)" opacity="0.9"/>
    
    <rect x="-6" y="-6" width="12" height="12" fill="#163031" transform="rotate(15)"/>
    <rect x="8" y="-12" width="8" height="8" fill="url(#paint3_linear)" opacity="0.7"/>
    <rect x="-16" y="8" width="8" height="8" fill="url(#paint3_linear)" opacity="0.7"/>
    
    <rect x="20" y="20" width="5" height="5" fill="#F0FF6C" opacity="0.8"/>
    <rect x="-25" y="-25" width="5" height="5" fill="#6BFDD9" opacity="0.8"/>
    <rect x="22" y="-22" width="4" height="4" fill="#6BFDD9" opacity="0.6"/>
